name: daily-market-check
on:
  schedule:
    - cron: "15 0 * * *"        # 每天 UTC 00:15 = 新加坡 08:15（ETF 数据 T+1 已更新，K 线已收盘）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python3 scripts/daily_check.py --out docs ${{ vars.POSITION == 'long' && '--position long' || '' }} --risk ${{ vars.RISK || '1' }}
      - name: commit
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs && git commit -m "daily $(date -u +%F)" || echo "no change"
          git push
      - name: telegram (可选，设置 TG_TOKEN / TG_CHAT 两个 secret 后生效)
        if: ${{ env.TG_TOKEN != '' }}
        env: { TG_TOKEN: "${{ secrets.TG_TOKEN }}", TG_CHAT: "${{ secrets.TG_CHAT }}" }
        run: curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text@docs/latest.md > /dev/null
